name: Fetch YouTube Data 
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetch script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube-data.js

      - name: Commit updated data
        run: |
          git config user.name "content-agent-bot"
          git config user.email "actions@github.com"
          git add dashboard/data.json
          git diff --staged --quiet || git commit -m "Update YouTube data"
          git push
